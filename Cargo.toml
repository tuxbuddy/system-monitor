[workspace]
resolver = "2"
members = [
    "crates/monitor-core",
    "crates/monitor-linux",
    "crates/monitor-remote",
    "crates/monitor-agent",
    "apps/monitor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/tuxbuddy/system-monitor"

[workspace.dependencies]
libc = "0.2"
nix = { version = "0.31", features = ["signal", "user"] }
serde_json = "1"

[profile.bench]
debug = false
