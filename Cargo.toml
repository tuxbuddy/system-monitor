[package]
name = "system-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Linux 系统诊断与控制工具：本地/远端采集、cgroup 调度、内核探针、MCP 服务"
repository = "https://github.com/tuxbuddy/system-monitor"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui_extras"]

[dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.37", optional = true }
libc = "0.2"
nix = { version = "0.31", features = ["signal", "user"] }
ratatui = "0.29"
serde_json = "1"