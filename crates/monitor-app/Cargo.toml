[package]
name = "monitor-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "应用服务层与前端：统一命令执行器、MCP、TUI、GUI"

[features]
gui = ["dep:eframe", "dep:egui_extras"]

[dependencies]
monitor-core = { path = "../monitor-core" }
monitor-linux = { path = "../monitor-linux" }
monitor-remote = { path = "../monitor-remote" }
libc = { workspace = true }
nix = { workspace = true }
serde_json = { workspace = true }
ratatui = "0.29"
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui_extras = { version = "0.37", optional = true }
