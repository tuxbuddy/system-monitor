# cargo-deny 配置：许可证白名单 + 重复依赖告警策略
[licenses]
version = 2
# 项目自身 MIT；依赖允许主流宽松许可证
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # egui 内嵌字体（default_fonts feature）携带的字体许可证：允许再分发
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.93

[bans]
# 重复依赖与通配符版本在 0.x 阶段仅告警(上游生态常见),不阻断;
# 许可证违规仍由 [licenses] 白名单硬阻断
multiple-versions = "warn"
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
